[package]
name = "strack"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Federal platform for live blocking orders against pirate football streams (hackathon MVP)"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
argon2 = "0.5"
axum = "0.8"
base64 = "0.22"
bytes = "1.12.1"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
font8x8 = "0.3.1"
futures-util = "0.3.34"
hex = "0.4"
hmac = "0.12"
image = { version = "0.25.9", default-features = false, features = ["jpeg"] }
maud = "0.27"
qrcode = { version = "0.14.1", default-features = false }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rqrr = { version = "0.10.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "fs", "net", "process", "io-util"] }
tokio-stream = "0.1.19"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = "1"

[profile.release]
lto = "thin"
